{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join SmartShop AI and start shopping smarter.
        </p>


        <form method="POST"
              action="{{ url_for('auth.register') }}">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    required
                >

            </div>


            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="">
                        Select account type
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="company">
                        Company
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn full-width"
            >
                Create Account
            </button>


        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>


    </div>

</div>

{% endblock %}
