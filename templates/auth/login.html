{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your SmartShop AI account.
        </p>


        <form method="POST"
              action="{{ url_for('auth.login') }}">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn full-width"
            >
                Login
            </button>


        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create Account
            </a>

        </p>


    </div>

</div>

{% endblock %}
