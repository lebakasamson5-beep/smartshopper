<!-- =========================================================
     SMARTSHOP AI - LOCAL STORE MAP (WORKING)
     - Auto-detects user location
     - Lightweight Overpass query (no more 504 errors)
     - 3 fallback servers
     - Reliable filters
     - Distance from user on every card
     ========================================================= -->


<!-- =========================================================
     LEAFLET CSS
     ========================================================= -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
/>


<!-- =========================================================
     OPEN MAP BUTTON
     ========================================================= -->
<button id="openShopMap" class="btn-primary" type="button">
    📍 Stores Near Me
</button>


<!-- =========================================================
     MAP MODAL
     ========================================================= -->
<div id="shopMapModal" class="shop-map-modal">

    <div class="shop-map-modal-content">

        <!-- HEADER -->
        <div class="shop-map-header">

            <div>
                <p class="small-heading">SMARTSHOP AI</p>
                <h2>📍 Stores Near You</h2>
                <p>Find Shoprite, Pick n Pay, SPAR, Checkers and Boxer stores.</p>
            </div>

            <button
                type="button"
                id="closeShopMap"
                class="shop-map-close"
                aria-label="Close map"
            >
                ✕
            </button>

        </div>


        <!-- FILTERS -->
        <div class="store-filter-container">

            <button type="button" class="store-filter active" data-store="all">🏪 All Stores</button>
            <button type="button" class="store-filter" data-store="shoprite">🛒 Shoprite</button>
            <button type="button" class="store-filter" data-store="pnp">🛍️ Pick n Pay</button>
            <button type="button" class="store-filter" data-store="spar">🏪 SPAR</button>
            <button type="button" class="store-filter" data-store="checkers">🛒 Checkers</button>
            <button type="button" class="store-filter" data-store="boxer">🏪 Boxer</button>

        </div>


        <!-- CONTROLS -->
        <div class="shop-map-controls">

            <button type="button" id="locateMeButton" class="locate-me-button">
                📍 Use My Location
            </button>

            <span id="mapStatus" class="map-status">
                Loading stores…
            </span>

        </div>


        <!-- MAP -->
        <div id="shopMap" class="shop-map"></div>


        <!-- RESULTS -->
        <div id="storeResults" class="store-results"></div>

    </div>

</div>


<!-- =========================================================
     LEAFLET JS
     ========================================================= -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
></script>


<!-- =========================================================
     MAP LOGIC
     ========================================================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const openButton   = document.getElementById("openShopMap");
    const closeButton  = document.getElementById("closeShopMap");
    const modal        = document.getElementById("shopMapModal");
    const locateButton = document.getElementById("locateMeButton");
    const mapStatus    = document.getElementById("mapStatus");
    const storeResults = document.getElementById("storeResults");


    if (!openButton || !modal) {
        console.warn("[SmartShop] Map button or modal not found.");
        return;
    }


    /* =====================================================
       STORE TYPES
       ===================================================== */

    const STORE_TYPES = {
        shoprite: { name: "Shoprite",   emoji: "🛒" },
        pnp:      { name: "Pick n Pay", emoji: "🛍️" },
        spar:     { name: "SPAR",       emoji: "🏪" },
        checkers: { name: "Checkers",   emoji: "🛒" },
        boxer:    { name: "Boxer",      emoji: "🏪" }
    };


    /* =====================================================
       STATE
       ===================================================== */

    let map                = null;
    let markers            = [];
    let allStores          = [];
    let userMarker         = null;
    let currentStoreFilter = "all";
    let storesLoaded       = false;
    let userLatitude       = null;
    let userLongitude      = null;


    /* =====================================================
       DEFAULT LOCATION (Durban)
       ===================================================== */

    const DEFAULT_LOCATION = {
        latitude:  -29.8587,
        longitude:  31.0218
    };


    /* =====================================================
       OPEN / CLOSE
       ===================================================== */

    openButton.addEventListener("click", function () {

        modal.classList.add("show");
        document.body.classList.add("map-modal-open");

        if (!map) {
            initializeMap();
        }

        setTimeout(function () {

            if (map) map.invalidateSize();

            if (!storesLoaded) {
                autoLocateUser();
            }

        }, 300);

    });


    closeButton.addEventListener("click", closeMap);

    modal.addEventListener("click", function (event) {
        if (event.target === modal) closeMap();
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && modal.classList.contains("show")) {
            closeMap();
        }
    });


    function closeMap() {
        modal.classList.remove("show");
        document.body.classList.remove("map-modal-open");
    }


    /* =====================================================
       INIT MAP
       ===================================================== */

    function initializeMap() {

        map = L.map("shopMap", {
            zoomControl: true
        }).setView(
            [DEFAULT_LOCATION.latitude, DEFAULT_LOCATION.longitude],
            13
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

    }


    /* =====================================================
       AUTO LOCATE
       ===================================================== */

    function autoLocateUser() {

        if (!navigator.geolocation) {
            mapStatus.textContent = "Location not supported — showing Durban area.";
            userLatitude  = DEFAULT_LOCATION.latitude;
            userLongitude = DEFAULT_LOCATION.longitude;
            loadStores(userLatitude, userLongitude, 5000);
            return;
        }

        mapStatus.textContent = "📍 Getting your location…";

        navigator.geolocation.getCurrentPosition(

            /* SUCCESS */
            function (position) {

                userLatitude  = position.coords.latitude;
                userLongitude = position.coords.longitude;

                map.setView([userLatitude, userLongitude], 14);

                if (userMarker) map.removeLayer(userMarker);

                userMarker = L.marker([userLatitude, userLongitude])
                    .addTo(map)
                    .bindPopup("<strong>📍 You are here</strong>");

                userMarker.openPopup();

                loadStores(userLatitude, userLongitude, 5000);

            },

            /* ERROR */
            function () {

                mapStatus.textContent = "Location denied — showing Durban area.";

                userLatitude  = DEFAULT_LOCATION.latitude;
                userLongitude = DEFAULT_LOCATION.longitude;

                map.setView([userLatitude, userLongitude], 13);

                loadStores(userLatitude, userLongitude, 5000);

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 300000
            }

        );

    }


    if (locateButton) {
        locateButton.addEventListener("click", autoLocateUser);
    }


    /* =====================================================
       FILTER BUTTONS
       ===================================================== */

    const filterButtons = document.querySelectorAll(".store-filter");

    filterButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            filterButtons.forEach(function (b) {
                b.classList.remove("active");
            });

            button.classList.add("active");

            currentStoreFilter = button.dataset.store;

            applyStoreFilter();

        });

    });


    /* =====================================================
       OVERPASS ENDPOINTS + FETCH HELPER
       ===================================================== */

    const OVERPASS_ENDPOINTS = [
        "https://overpass.kumi.systems/api/interpreter",
        "https://overpass-api.de/api/interpreter",
        "https://overpass.private.coffee/api/interpreter"
    ];


    async function fetchOverpass(query) {

        for (let i = 0; i < OVERPASS_ENDPOINTS.length; i++) {

            const endpoint = OVERPASS_ENDPOINTS[i];
            const url = endpoint + "?data=" + encodeURIComponent(query);

            try {

                console.log(`[SmartShop] Trying endpoint ${i+1}/${OVERPASS_ENDPOINTS.length}...`);

                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 25000);

                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);

                if (response.ok) {
                    console.log(`[SmartShop] Success on ${endpoint}`);
                    return await response.json();
                }

                console.warn(`[SmartShop] ${endpoint} → ${response.status}`);

            } catch (err) {
                console.warn(`[SmartShop] ${endpoint} failed: ${err.message}`);
            }
        }

        throw new Error("All Overpass servers are busy. Try again in a minute.");
    }


    /* =====================================================
       LOAD STORES — lightweight query
       ===================================================== */

    async function loadStores(latitude, longitude, radiusMeters) {

        const radius = radiusMeters || 5000;

        mapStatus.textContent =
            `🔎 Searching within ${(radius / 1000).toFixed(0)} km…`;

        markers.forEach(function (item) {
            if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
        });
        markers = [];


        /* -------- SIMPLE QUERY -------- */

        const regex = "Shoprite|Pick n Pay|SPAR|Checkers|Boxer";

        const query =
            `[out:json][timeout:15];` +
            `(` +
                `node(around:${radius},${latitude},${longitude})["name"~"${regex}",i];` +
                `way(around:${radius},${latitude},${longitude})["name"~"${regex}",i];` +
            `);` +
            `out center tags;`;


        try {

            const data     = await fetchOverpass(query);
            const elements = data.elements || [];

            console.log("[SmartShop] Raw OSM elements:", elements.length);

            const stores = [];

            elements.forEach(function (element) {

                const tags = element.tags || {};

                let storeLatitude  = element.lat;
                let storeLongitude = element.lon;

                if (storeLatitude === undefined && element.center) {
                    storeLatitude  = element.center.lat;
                    storeLongitude = element.center.lon;
                }

                if (storeLatitude === undefined || storeLongitude === undefined) return;

                const storeName =
                    tags.name || tags.brand || tags.operator || "Store";

                const storeBrand = identifyStoreBrand(
                    storeName, tags.brand, tags.operator
                );

                if (!storeBrand) return;

                const duplicate = stores.some(function (existing) {
                    return (
                        existing.storeBrand === storeBrand &&
                        Math.abs(existing.latitude - storeLatitude) < 0.0001 &&
                        Math.abs(existing.longitude - storeLongitude) < 0.0001
                    );
                });

                if (duplicate) return;

                stores.push({
                    name:       storeName,
                    storeBrand: storeBrand,
                    latitude:   storeLatitude,
                    longitude:  storeLongitude,
                    address:    buildAddress(tags)
                });

            });

            console.log("[SmartShop] Recognised stores:", stores.length);


            /* Retry at 15 km */
            if (stores.length === 0 && radius === 5000) {
                console.log("[SmartShop] Nothing at 5 km — retrying at 15 km");
                return loadStores(latitude, longitude, 15000);
            }


            /* Sort by distance */
            if (userLatitude !== null && userLongitude !== null) {
                stores.sort(function (a, b) {
                    return (
                        distanceKm(userLatitude, userLongitude, a.latitude, a.longitude) -
                        distanceKm(userLatitude, userLongitude, b.latitude, b.longitude)
                    );
                });
            }


            allStores    = stores.slice();
            storesLoaded = true;

            applyStoreFilter();


            if (stores.length === 0) {

                mapStatus.textContent = "No matching stores found nearby.";

                storeResults.innerHTML = `
                    <div class="no-stores-message">
                        <strong>😕 No stores found</strong>
                        <p>OpenStreetMap doesn't have these stores within 15 km of you.</p>
                    </div>
                `;

            } else {

                mapStatus.textContent =
                    `${stores.length} store(s) found within ` +
                    `${(radius / 1000).toFixed(0)} km`;

            }

        } catch (error) {

            console.error("[SmartShop] Map error:", error);

            mapStatus.textContent = "Server busy — try again in a moment.";

            storeResults.innerHTML = `
                <div class="no-stores-message">
                    <strong>⚠️ Store search failed</strong>
                    <p>${escapeHtml(error.message)}</p>
                    <p style="margin-top:8px;font-size:12px;">
                        Click <strong>Use My Location</strong> to retry.
                    </p>
                </div>
            `;

        }

    }


    /* =====================================================
       IDENTIFY STORE BRAND
       ===================================================== */

    function identifyStoreBrand(name, brand, operator) {

        const text = (
            String(name || "") + " " +
            String(brand || "") + " " +
            String(operator || "")
        ).toLowerCase();

        if (text.includes("shoprite")) return "shoprite";

        if (text.includes("pick n pay") || text.includes("picknpay")) return "pnp";

        if (
            text.includes("spar") ||
            text.includes("superspar") ||
            text.includes("kwikspar")
        ) return "spar";

        if (text.includes("checkers")) return "checkers";

        if (text.includes("boxer")) return "boxer";

        return null;

    }


    /* =====================================================
       BUILD ADDRESS
       ===================================================== */

    function buildAddress(tags) {

        const parts = [];

        if (tags["addr:housenumber"]) parts.push(tags["addr:housenumber"]);
        if (tags["addr:street"])      parts.push(tags["addr:street"]);
        if (tags["addr:suburb"])      parts.push(tags["addr:suburb"]);
        if (tags["addr:city"])        parts.push(tags["addr:city"]);
        if (tags["addr:postcode"])    parts.push(tags["addr:postcode"]);

        return parts.length ? parts.join(", ") : "Address not available";

    }


    /* =====================================================
       DISTANCE (Haversine km)
       ===================================================== */

    function distanceKm(lat1, lon1, lat2, lon2) {

        const toRad = x => (x * Math.PI) / 180;
        const R = 6371;

        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon / 2) ** 2;

        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    }


    /* =====================================================
       APPLY FILTER — rebuild markers + cards from allStores
       ===================================================== */

    function applyStoreFilter() {

        markers.forEach(function (item) {
            if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
        });
        markers = [];

        storeResults.innerHTML = "";


        const visible = allStores.filter(function (store) {
            return (
                currentStoreFilter === "all" ||
                store.storeBrand === currentStoreFilter
            );
        });


        visible.forEach(function (store) {

            const info = STORE_TYPES[store.storeBrand];

            let distanceText = "";
            if (userLatitude !== null && userLongitude !== null) {
                const d = distanceKm(
                    userLatitude, userLongitude,
                    store.latitude, store.longitude
                );
                distanceText = d < 1
                    ? `${Math.round(d * 1000)} m away`
                    : `${d.toFixed(1)} km away`;
            }


            const marker = L.marker([store.latitude, store.longitude]).addTo(map);

            const directionsUrl =
                "https://www.google.com/maps/dir/?api=1" +
                "&destination=" +
                encodeURIComponent(store.latitude + "," + store.longitude);

            marker.bindPopup(`
                <div class="store-popup">
                    <div class="store-popup-title">
                        <span>${info.emoji}</span>
                        <strong>${escapeHtml(store.name)}</strong>
                    </div>
                    <p><strong>${escapeHtml(info.name)}</strong></p>
                    <p>📍 ${escapeHtml(store.address)}</p>
                    ${distanceText ? `<p>🧭 ${escapeHtml(distanceText)}</p>` : ""}
                    <a href="${directionsUrl}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="directions-button">
                        🧭 Get Directions
                    </a>
                </div>
            `);

            markers.push({ marker: marker, store: store });


            const card = document.createElement("div");
            card.className = "store-result-card";
            card.dataset.store = store.storeBrand;

            card.innerHTML = `
                <div class="store-result-icon">${info.emoji}</div>
                <div class="store-result-details">
                    <strong>${escapeHtml(store.name)}</strong>
                    <span>${escapeHtml(info.name)}</span>
                    <small>📍 ${escapeHtml(store.address)}</small>
                    ${distanceText
                        ? `<small class="store-distance">🧭 ${escapeHtml(distanceText)}</small>`
                        : ""}
                </div>
                <button type="button" class="store-view-button">View</button>
            `;

            card.querySelector(".store-view-button").addEventListener("click", function () {
                map.setView([store.latitude, store.longitude], 16);
                marker.openPopup();
            });

            storeResults.appendChild(card);

        });


        if (storesLoaded) {
            if (currentStoreFilter === "all") {
                mapStatus.textContent = `${visible.length} store(s) found`;
            } else {
                mapStatus.textContent =
                    `${visible.length} ${STORE_TYPES[currentStoreFilter].name} store(s) found`;
            }
        }

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

});
</script>
